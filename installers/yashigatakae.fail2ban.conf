# yashigatakae fail2ban jail
# Drop into /etc/fail2ban/jail.d/ on your VPS, then:
#   sudo systemctl restart fail2ban
#
# Watches the audit JSONL for repeated 401/403 attempts from the same IP and
# bans for 1 hour. Tweak `maxretry` and `bantime` to taste.

[yashigatakae]
enabled  = true
port     = 8443,8444,80,443
logpath  = /var/log/yashigatakae/audit.log
backend  = auto
findtime = 5m
maxretry = 10
bantime  = 1h
filter   = yashigatakae
