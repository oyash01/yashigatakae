# yashigatakae fail2ban filter
# Drop into /etc/fail2ban/filter.d/yashigatakae.conf on your VPS.
#
# Matches JSONL audit lines where status=401 or 403, extracts the client IP
# from the "ip" field. fail2ban's <HOST> regex anchor binds it.

[Definition]
failregex = ^.*"ip":"<HOST>".*"status":(401|403).*$
ignoreregex =
