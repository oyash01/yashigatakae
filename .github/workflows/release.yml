name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
            ext: ''
            archive: tar.gz
          - os: darwin
            arch: amd64
            ext: ''
            archive: tar.gz
          - os: linux
            arch: amd64
            ext: ''
            archive: tar.gz
          - os: linux
            arch: arm64
            ext: ''
            archive: tar.gz
          - os: windows
            arch: amd64
            ext: '.exe'
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          GOOS:   ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          binname="yashigatakae${{ matrix.ext }}"
          go build -trimpath \
            -ldflags "-s -w -X main.Version=${{ steps.ver.outputs.tag }}" \
            -o "dist/$binname" \
            ./cmd/yashigatakae

      - name: Package
        run: |
          cd dist
          stem="yashigatakae-${{ matrix.os }}-${{ matrix.arch }}"
          binname="yashigatakae${{ matrix.ext }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -9 "${stem}.zip" "$binname"
          else
            tar -czf "${stem}.tar.gz" "$binname"
          fi
          shasum -a 256 "${stem}".* > "${stem}.sha256"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: yashigatakae-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/yashigatakae-${{ matrix.os }}-${{ matrix.arch }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Aggregate checksums
        run: |
          mkdir -p out
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} out/ \;
          cd out
          shasum -a 256 *.tar.gz *.zip > checksums.txt
          ls -la

      - name: Resolve tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          # Pull the section between "## $tag" and the next "## " header.
          awk -v tag="$tag" '
            $0 ~ "^## "tag { found=1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "yashigatakae $tag" > release-notes.md
            echo "" >> release-notes.md
            echo "See [CHANGELOG.md](https://github.com/oyash01/yashigatakae/blob/main/CHANGELOG.md) for the full version history." >> release-notes.md
          fi
          # Append install + checksum boilerplate to every release.
          # NOTE: do NOT use a leading "---" column-0 line here — YAML would
          # parse it as a document separator, breaking the workflow file.
          {
            echo ""
            echo "## Install"
            echo ""
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/oyash01/yashigatakae/main/installers/install.sh | sh"
            echo "yashigatakae init"
            echo '```'
            echo ""
            echo "Windows (PowerShell):"
            echo '```powershell'
            echo "irm https://raw.githubusercontent.com/oyash01/yashigatakae/main/installers/install.ps1 | iex"
            echo '```'
            echo ""
            echo "## Verify"
            echo ""
            echo '```bash'
            echo "shasum -a 256 -c checksums.txt"
            echo '```'
            echo ""
            echo "## Docs"
            echo ""
            echo "- [Getting Started](https://github.com/oyash01/yashigatakae/blob/main/docs/getting-started.md)"
            echo "- [VPS Setup](https://github.com/oyash01/yashigatakae/blob/main/docs/vps-setup.md)"
            echo "- [Architecture](https://github.com/oyash01/yashigatakae/blob/main/docs/architecture.md)"
            echo "- [LLM Install Manual](https://github.com/oyash01/yashigatakae/blob/main/docs/LLM-INSTALL.md)"
            echo ""
            echo "Built by [TeamOYash Technologies](https://github.com/oyash01) — \`@OYash01\`."
          } >> release-notes.md
          echo "----- release notes -----"
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: yashigatakae ${{ steps.ver.outputs.tag }}
          body_path: release-notes.md
          files: |
            out/*.tar.gz
            out/*.zip
            out/checksums.txt
